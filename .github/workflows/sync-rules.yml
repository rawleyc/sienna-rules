name: Sync Detections as Code (Self-Managed via GitHub Cloud)

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**' # Only trigger if files change inside the rules folder

jobs:
  deploy-rules:
    # Fixed! Switched from self-hosted to standard GitHub-hosted cloud runners
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Puncture a temporary opening in your AWS Security Group for this runner's IP
      - name: Open Port 5601 in AWS Security Group
        uses: sohelamin/aws-security-group-add-ip-action@v1.0.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'eu-central-1' # Replace with your actual AWS region if different
          aws-security-group-id: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          port: '5601'
          protocol: 'tcp'
          description: 'GitHub Action Ephemeral Runner'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests pyyaml

      # 2. Deploy your rules directly to your public AWS instance endpoint
      - name: Deploy Rules via Kibana API
        env:
          KIBANA_URL: "https://${{ secrets.SSH_HOST }}:5601"
          KIBANA_API_KEY: ${{ secrets.KIBANA_API_KEY }}
        run: |
          python .github/scripts/sync_rules.py

      # NOTE: The "aws-security-group-add-ip-action" has a built-in post-execution hook.
      # When this job finishes or crashes, it automatically deletes its IP address 
      # from your AWS Security Group so your environment stays locked down!
