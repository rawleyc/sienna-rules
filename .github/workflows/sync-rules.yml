name: Sync Detections as Code (Self-Managed via GitHub Cloud)

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**' # Only trigger if files change inside the rules folder

jobs:
  deploy-rules:
    # Fixed! Switched from self-hosted to standard GitHub-hosted cloud runners
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Puncture a temporary opening in your AWS Security Group for this runner's IP
      - name: Open Port 5601 in AWS Security Group
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
        run: |
          RUNNER_IP="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')"
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$AWS_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=5601,ToPort=5601,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description='GitHub Action Ephemeral Runner'}]"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests pyyaml

      # 2. Verify and deploy directly to the public AWS instance endpoint
      - name: Check Kibana connectivity
        env:
          KIBANA_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --silent --show-error --connect-timeout 10 --max-time 10 -o /dev/null "http://${KIBANA_HOST}:5601/api/status"; then
              exit 0
            fi
            echo "Kibana is not reachable yet; retrying in 10 seconds..."
            sleep 10
          done
          echo "Kibana did not accept connections on HTTP port 5601."
          exit 1

      - name: Deploy Rules via Kibana API
        env:
          KIBANA_URL: "http://${{ secrets.SSH_HOST }}:5601"
          KIBANA_API_KEY: ${{ secrets.KIBANA_API_KEY }}
        run: |
          python .github/scripts/sync_rules.py

      - name: Close Port 5601 in AWS Security Group
        if: always() && env.RUNNER_IP != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$AWS_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 5601 \
            --cidr "${RUNNER_IP}/32" || true
